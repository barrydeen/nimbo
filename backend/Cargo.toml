[package]
name = "nimbo"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Self-hosted markdown knowledge base with a built-in agent"

[[bin]]
name = "nimbo"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["macros", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace", "compression-gzip"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
chacha20poly1305 = "0.10"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
async-stream = "0.3"
tokio-util = { version = "0.7.20", features = ["io"] }
mime_guess = "2.0.5"
mime = "0.3.18"
infer = "0.22.0"
content_inspector = "0.2.4"
percent-encoding = "2.3.2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "tiff", "bmp"] }
kamadak-exif = "0.6.2"
pdf-extract = "0.12.1"
lopdf = "0.42.0"
zip = { version = "9.6.0", default-features = false, features = ["deflate"] }
quick-xml = "0.42.0"
lofty = "0.25.5"
